<svg width="100%" height="32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="lucianopereira@posteo.es">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #24292f; }
    .muted   { fill: #969289; }
    .rule    { stroke: #969289; stroke-opacity: .35; }
    @media (prefers-color-scheme: dark) { .primary { fill: #dfe2e2; } }
    text:hover { text-decoration: underline; }

    .short { display: none; }
    @media (max-width: 319px) {           /* phone: short name, no arrow */
      .full, .arrow { display: none; }
      .short { display: inline; }
    }
    @media (max-width: 149px) {           /* very narrow: drop the glyph too */
      .glyph { display: none; }
      .short { transform: translateX(-26px); }
    }
    .pill { width: calc(100% - 1px); }
  </style>
  <rect class="rule pill" x=".5" y=".5" width="100%" height="31" rx="15.5" stroke-width="1"/>
  <circle cx="17" cy="16" r="6" fill="#bc776f"/>
  <g class="glyph"><g transform="translate(33 7) scale(.75)" fill="none" stroke="#969289" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g></g>
  <text class="sans primary full" x="60" y="21.5" font-size="16">lucianopereira@posteo.es</text>
  <text class="sans primary short" x="60" y="21.5" font-size="16">Mail</text>
  <text class="sans muted arrow" x="100%" dx="-18" y="21.5" font-size="16" text-anchor="end">↗</text>
</svg>
