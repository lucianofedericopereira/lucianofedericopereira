<svg viewBox="0 0 400 242" width="400" height="242" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Co-Founder &amp; CTO · 365 Carilo · Jan 2009 – Dec 2015">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <text class="sans muted" x="42" y="24" font-size="14">Jan 2009 – Dec 2015</text>
    <circle cx="24" cy="44" r="8" fill="#bcb57b"/>
    <text class="sans primary" x="42" y="50" font-size="18" font-weight="600">Co-Founder &amp; CTO</text>
    <text class="sans primary" x="42" y="74" font-size="16">365 Carilo</text>
    <text class="sans muted" x="42" y="102" font-size="16">Built publishing platform for luxury media</text>
    <text class="sans muted" x="42" y="124" font-size="16">(polo, real estate, luxury auto)</text>
    <text class="sans muted" x="42" y="154" font-size="16">Reached 100% of Cariló's 7,000</text>
    <text class="sans muted" x="42" y="176" font-size="16">residences &amp; 20,000 affluent subscribers</text>
  </g>
</svg>
