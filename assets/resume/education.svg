    <text class="sans primary" x="48" y="70" font-size="17">M.Sc. Data Science</text>
    <text class="sans muted" x="48" y="90" font-size="15">U.B.A.</text>
    <text class="sans muted" x="0" y="116" font-size="15">2014</text>
    <text class="sans primary" x="48" y="116" font-size="17">LL.M. Law &amp; Economics</text>
    <text class="sans muted" x="48" y="136" font-size="15">U.B.A.</text>
