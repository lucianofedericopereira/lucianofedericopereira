<svg viewBox="0 0 784 100" width="784" height="100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Product Owner · Consejo de la Magistratura C.A.B.A. · Sep 2005 – Dec 2008">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <circle cx="8" cy="16" r="8" fill="#6788a5"/>
    <text class="sans primary" x="26" y="22" font-size="18"><tspan font-weight="600">Product Owner</tspan> · Consejo de la Magistratura C.A.B.A.</text>
    <text class="sans muted" x="784" y="22" font-size="15" text-anchor="end">Sep 2005 – Dec 2008</text>
    <text class="sans muted" x="26" y="48" font-size="16">Paperless judiciary case-management platform (~400,000 legal cases)</text>
    <text class="sans muted" x="26" y="70" font-size="16">Led cross-functional team on mission-critical system with 10,000+ users</text>
  </g>
</svg>
