<svg viewBox="0 0 400 242" width="400" height="242" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Legal Tech Developer &amp; Mediator · Mediaciones.ar · Mar 2016 – Dec 2017">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <text class="sans muted" x="42" y="24" font-size="14">Mar 2016 – Dec 2017</text>
    <circle cx="24" cy="44" r="8" fill="#6e93bc"/>
    <text class="sans primary" x="42" y="50" font-size="18" font-weight="600">Legal Tech Developer &amp; Mediator</text>
    <text class="sans primary" x="42" y="74" font-size="16">Mediaciones.ar</text>
    <text class="sans muted" x="42" y="102" font-size="16">Architected automated mediation platform</text>
    <text class="sans muted" x="42" y="124" font-size="16">(processed 10,000+ dispute cases)</text>
    <text class="sans muted" x="42" y="154" font-size="16">Established cross-functional</text>
    <text class="sans muted" x="42" y="176" font-size="16">conflict-resolution protocols</text>
    <text class="sans muted" x="42" y="198" font-size="16">&amp; codebase reviews</text>
  </g>
</svg>
