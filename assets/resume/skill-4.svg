<svg viewBox="0 0 400 114" width="400" height="114" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data: MySQL · PostgreSQL · MongoDB · Redis · Eloquent ORM · Python · Pandas">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <circle cx="24" cy="18" r="8" fill="#6788a5"/>
    <text class="sans primary" x="42" y="24" font-size="15" font-weight="600">Data</text>
    <text class="sans muted" x="42" y="50" font-size="16">MySQL · PostgreSQL · MongoDB · Redis</text>
    <text class="sans muted" x="42" y="72" font-size="16">Eloquent ORM · Python · Pandas</text>
  </g>
</svg>
