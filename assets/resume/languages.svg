<svg viewBox="0 0 400 242" width="400" height="242" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spoken Languages: Spanish Native, English C2 · Proficient, Italian B2 · Upper Intermediate">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <text class="sans muted" x="0" y="30" font-size="24">Spoken Languages</text>
    <text class="sans primary" x="0" y="70" font-size="17">Spanish</text>
    <text class="sans muted" x="384" y="70" font-size="15" text-anchor="end">Native</text>
    <rect fill="#9be9a8" x="0.0" y="82" width="59.0" height="12" rx="3"/>
    <rect fill="#9be9a8" x="65.0" y="82" width="59.0" height="12" rx="3"/>
    <rect fill="#40c463" x="130.0" y="82" width="59.0" height="12" rx="3"/>
    <rect fill="#40c463" x="195.0" y="82" width="59.0" height="12" rx="3"/>
    <rect fill="#30a14e" x="260.0" y="82" width="59.0" height="12" rx="3"/>
    <rect fill="#216e39" x="325.0" y="82" width="59.0" height="12" rx="3"/>
    <text class="sans primary" x="0" y="134" font-size="17">English</text>
    <text class="sans muted" x="384" y="134" font-size="15" text-anchor="end">C2 · Proficient</text>
    <rect fill="#9be9a8" x="0.0" y="146" width="59.0" height="12" rx="3"/>
    <rect fill="#9be9a8" x="65.0" y="146" width="59.0" height="12" rx="3"/>
    <rect fill="#40c463" x="130.0" y="146" width="59.0" height="12" rx="3"/>
    <rect fill="#40c463" x="195.0" y="146" width="59.0" height="12" rx="3"/>
    <rect fill="#30a14e" x="260.0" y="146" width="59.0" height="12" rx="3"/>
    <rect fill="#216e39" x="325.0" y="146" width="59.0" height="12" rx="3"/>
    <text class="sans primary" x="0" y="198" font-size="17">Italian</text>
    <text class="sans muted" x="384" y="198" font-size="15" text-anchor="end">B2 · Upper Intermediate</text>
    <rect fill="#9be9a8" x="0.0" y="210" width="59.0" height="12" rx="3"/>
    <rect fill="#9be9a8" x="65.0" y="210" width="59.0" height="12" rx="3"/>
    <rect fill="#40c463" x="130.0" y="210" width="59.0" height="12" rx="3"/>
    <rect fill="#40c463" x="195.0" y="210" width="59.0" height="12" rx="3"/>
    <rect class="empty" x="260.0" y="210" width="59.0" height="12" rx="3"/>
    <rect class="empty" x="325.0" y="210" width="59.0" height="12" rx="3"/>
  </g>
