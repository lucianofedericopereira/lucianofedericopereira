<svg viewBox="0 0 400 252" width="400" height="252" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spoken Languages: Spanish Native, English C2 · Proficient, Italian B2 · Upper Intermediate">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <text class="sans muted" x="16" y="38" font-size="24">Spoken Languages</text>
    <text class="sans primary" x="16" y="80" font-size="17">Spanish</text>
    <text class="sans muted" x="384" y="80" font-size="15" text-anchor="end">Native</text>
    <rect fill="#9be9a8" x="16.0" y="92" width="56.3" height="12" rx="3"/>
    <rect fill="#9be9a8" x="78.3" y="92" width="56.3" height="12" rx="3"/>
    <rect fill="#40c463" x="140.7" y="92" width="56.3" height="12" rx="3"/>
    <rect fill="#40c463" x="203.0" y="92" width="56.3" height="12" rx="3"/>
    <rect fill="#30a14e" x="265.3" y="92" width="56.3" height="12" rx="3"/>
    <rect fill="#216e39" x="327.7" y="92" width="56.3" height="12" rx="3"/>
    <text class="sans primary" x="16" y="144" font-size="17">English</text>
    <text class="sans muted" x="384" y="144" font-size="15" text-anchor="end">C2 · Proficient</text>
    <rect fill="#9be9a8" x="16.0" y="156" width="56.3" height="12" rx="3"/>
    <rect fill="#9be9a8" x="78.3" y="156" width="56.3" height="12" rx="3"/>
    <rect fill="#40c463" x="140.7" y="156" width="56.3" height="12" rx="3"/>
    <rect fill="#40c463" x="203.0" y="156" width="56.3" height="12" rx="3"/>
    <rect fill="#30a14e" x="265.3" y="156" width="56.3" height="12" rx="3"/>
    <rect fill="#216e39" x="327.7" y="156" width="56.3" height="12" rx="3"/>
    <text class="sans primary" x="16" y="208" font-size="17">Italian</text>
    <text class="sans muted" x="384" y="208" font-size="15" text-anchor="end">B2 · Upper Intermediate</text>
    <rect fill="#9be9a8" x="16.0" y="220" width="56.3" height="12" rx="3"/>
    <rect fill="#9be9a8" x="78.3" y="220" width="56.3" height="12" rx="3"/>
    <rect fill="#40c463" x="140.7" y="220" width="56.3" height="12" rx="3"/>
    <rect fill="#40c463" x="203.0" y="220" width="56.3" height="12" rx="3"/>
    <rect class="empty" x="265.3" y="220" width="56.3" height="12" rx="3"/>
    <rect class="empty" x="327.7" y="220" width="56.3" height="12" rx="3"/>
  </g>
</svg>
