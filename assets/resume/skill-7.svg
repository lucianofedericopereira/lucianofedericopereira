<svg viewBox="0 0 400 90" width="400" height="90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflows: Agile · Scrum · Kanban · CLI &amp; Scripting · Remote Work">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <circle cx="8" cy="12" r="8" fill="#bcb57b"/>
    <text class="sans primary" x="26" y="18" font-size="15" font-weight="600">Workflows</text>
    <text class="sans muted" x="26" y="44" font-size="16">Agile · Scrum · Kanban · CLI &amp; Scripting</text>
    <text class="sans muted" x="26" y="66" font-size="16">Remote Work</text>
  </g>
</svg>
