<svg viewBox="0 0 400 254" width="400" height="254" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub metrics — Luciano Pereira: 4.275 commits, 136 stargazers">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "DejaVu Sans", Helvetica, Arial, sans-serif; }
    .primary { fill: #1f2328; }
    .muted   { fill: #57544e; }
    .empty   { fill: #ebedf0; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f0f6fc; }
      .muted   { fill: #b1aea7; }
      .empty   { fill: #2d333b; }
    }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1 { animation-delay: .05s; }
    .a2 { animation-delay: .15s; }
    .a3 { animation-delay: .25s; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    
  </style>

  <!-- HEADER -->
  <g class="rise a1">
    <clipPath id="avatar-clip"><circle cx="24" cy="40" r="24"/></clipPath>
    <image x="0" y="16" width="48" height="48" clip-path="url(#avatar-clip)"
           href="data:image/png;base64,"/>
