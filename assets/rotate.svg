<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg-fill { fill: #24292f; }
    .fg-stroke { stroke: #24292f; }
    .fg-border { stroke: #24292f; fill: none; }
    .bg{fill:#ffffff}
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117}
      .fg-fill { fill: #f0f6fc; }
      .fg-stroke { stroke: #f0f6fc; }
      .fg-border { stroke: #f0f6fc; }
    }
  </style>

  <defs>
    <path id="circlePath" d="M 50,50 m -32,0 a 32,32 0 1,1 64,0 a 32,32 0 1,1 -64,0" />
  </defs>
<rect class="bg" width="100" height="100" rx="50" />
  <g>
    <text class="fg-fill" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">
      <textPath href="#circlePath" textLength="201" lengthAdjust="spacing">
      FULL STACK DEV • LUCIANO • 
      </textPath>
    </text>

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      begin="0s"
      dur="10s"
      repeatCount="indefinite" />
  </g>
  <g>
    <circle cx="50" cy="50" r="18" class="fg-border" stroke-width="2" />
    <path d="M 44,48 L 50,55 L 56,48" class="fg-stroke" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -1.5; 0 2; 0 -1.5"
        keyTimes="0; 0.5; 1"
        dur="1.2s"
        repeatCount="indefinite" />
    </path>
  </g>
</svg>
